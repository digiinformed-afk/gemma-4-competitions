our selected historical cases; no fresh Gemma execution in inspected notebook."},{"id":"loop","title":"Loop Breaker / Trap-25","url":"https://www.kaggle.com/code/robinamirbahar/gemma-4-loop-breaker-ccr-trap-25-benchmark","kind":"Community","date":"Saved review inspected v12","note":"Default deterministic path used supplied patches; displayed recovery is not fresh autonomous model repair."},{"id":"baseline","title":"Hanh Tran • budgeted baseline","url":"https://www.kaggle.com/code/honghanhhh/gemma-4-baseline-lb-0-24","kind":"Community","date":"Saved review inspected v8","note":"28 calls, 8 minutes, phased search/edit/test prompt. Title is not reliable score evidence."},{"id":"shadow","title":"Development-task validation and package shadowing","url":"https://www.kaggle.com/competitions/gemma-4-developer-agent/discussion/747248","kind":"Community","date":"Checked 11 Nov 2026","note":"Participant reports empty-patch passes caused by installed Requests overshadowing checkout; verify imports and buggy/gold controls in the exact environment."},{"id":"catalog","title":"Public paper-track notebook catalog","url":"https://www.kaggle.com/competitions/gemma-4-developer-agent-paper/code","kind":"Official","date":"Indexed listing checked 11 Nov","note":"Includes GraphNav, AST compression, CRAG and failure taxonomies. Listing alone proves neither submission nor claimed gains."},{"id":"peft","title":"Hugging Face PEFT • LoRA documentation","url":"https://huggingface.co/docs/peft/conceptual_guides/lora","kind":"Reference","date":"Concept reference","note":"Background reading for parameter-efficient adaptation."},{"id":"adk","title":"Google ADK documentation","url":"https://google.github.io/adk-docs/","kind":"Reference","date":"Concept reference","note":"Agent orchestration background. Competition restrictions take precedence."},{"id":"vllm","title":"vLLM documentation","url":"https://docs.vllm.ai/","kind":"Reference","date":"Concept reference","note":"Serving background; use organizer-pinned versions in scoring."}],"tracks":[{"name":"Paper track","project":"Hikmah Questions / PatchQuestions","question":"Can we ask better questions before choosing a behavior?","analogy":"Several keys look alike. Which quick check tells you which one opens the right lock?","deliverable":"An original, unpublished Kaggle Writeup, at most 3,000 words; optional public notebook/PDF links.","metric":"Five equally weighted criteria: novelty, quality, relevance, verifiability and clarity.","status":"CPU benchmark reproduced; manuscript prepared. A submitted entry is not confirmed.","deadline":"13 Nov 2026 · 04:59 PKT","utc":"2026-11-12T23:59:00Z","prize":"$35,000: $15k overall, $10k resource, $10k application.","link":"paper"},{"name":"Main agent competition","project":"Hikmah developer agent","question":"Can an offline Gemma agent fix real Python repository issues?","analogy":"A mechanic gets a fault report, a workshop and a time limit. The repaired machine must pass inspection.","deliverable":"submission.zip with agent.yaml at its root, prompts, supported skills and optional adapters.","metric":"Fraction of issues whose patched repositories pass validation tests.","status":"Saved three-task pilot: all arms 2/3. Newer runs reported; no leaderboard score or final entry confirmed.","deadline":"3 Dec 2026 · 04:59 PKT","utc":"2026-12-02T23:59:00Z","prize":"$65,000 ranked awards ($37k / $18k / $10k), plus $10k small-model bonus.","link":"prizes"}],"models":[{"name":"31B","id":"gemma-4-31b-it-qat-w4a16-ct","role":"Current saved Hikmah base","simple":"The larger engine in our saved agent. More capability per decision may cost more time and memory.","detail":"Official 31B IT QAT W4A16 CT v2 is attached in the saved pilot protocol. No trained adapter is recorded. Exact newest-run checkpoint digest still needs audit.","status":"Used in saved pilot"},{"name":"12B","id":"gemma-4-12b-it-qat-w4a16-ct","role":"Allowed comparison","simple":"A middle-size option worth timing against 31B.","detail":"Supported by organizers; public starter inspected previously used 12B. Loader compatibility depends on the pinned wheelhouse. No matched project comparison recorded.","status":"Allowed · not measured here"},{"name":"E4B","id":"gemma-4-e4b-it-qat-w4a16-ct","role":"Planned separate experiment","simple":"A compact option that may leave more room for retries and tests.","detail":"Eligible for the small-model bonus when selected as an eligible final. FGL research uses E4B, but its numbers do not describe our agent. No project E4B repair result recovered.","status":"Planned"},{"name":"E2B","id":"gemma-4-e2b-it-qat-w4a16-ct","role":"Optional separate comparison","simple":"Another compact option. Smaller alone does not guarantee more correct fixes.","detail":"Also eligible for the small-model award. Compare complete task success at the same total budget, with exact model/runtime fingerprints.","status":"Optional"}],"paperResults":[{"policy":"No questions","score":7.05,"cost":null},{"policy":"Random","score":56.83,"cost":null},{"policy":"Random informative","score":76.32,"cost":null},{"policy":"Most outcomes","score":84.81,"cost":null},{"policy":"Entropy","score":85.27,"cost":1.881979},{"policy":"Ordinary tree","score":85.48,"cost":2.265625},{"policy":"Frugal tree","score":85.48,"cost":1.864479}],"pilot":[{"arm":"Control","resolved":2,"total":3,"calls":79,"seconds":1432.954538254,"tasks":[29,16,34]},{"arm":"Generic policy","resolved":2,"total":3,"calls":102,"seconds":1503.761469512,"tasks":[30,40,32]},{"arm":"Hikmah","resolved":2,"total":3,"calls":87,"seconds":1421.745518308,"tasks":[17,30,40]}],"timeline":[{"date":"5–7 Nov","track":"Paper","title":"Revised and reproduced the CPU study","status":"Artifact","text":"18,000 score rows reproduced byte for byte on CPython 3.12.14; all 16 notebook cells executed. Strict optional supervisor passed 12 regression tests.","source":"brief"},{"date":"7 Nov","track":"Both","title":"Project published for continuity","status":"Artifact","text":"Both workspaces, code, checkpoints and downloads saved to GitHub/Pages. PatchQuestions later merged into the Hikmah Questions research direction.","source":"repo"},{"date":"8–9 Nov","track":"Agent","title":"Runtime repair and matched three-arm pilot","status":"Artifact","text":"Control, generic policy and Hikmah each resolved Requests and Rich; FastAPI unresolved. Dependency, import-path, pytest and packaging repairs are part of the experiment history.","source":"pilot"},{"date":"9 Nov","track":"Agent","title":"V11 reconstructed","status":"Artifact","text":"10 minutes, 65 calls, 95 turns; shorter decoding; batch search, full API wiring, import checks. CPU checks passed. Source README still says GPU pending and is a historical snapshot.","source":"v11"},{"date":"10–11 Nov","track":"Agent","title":"V12 / control / V14 comparison","status":"Reported","text":"Each reportedly solved 2/3 development tasks. FastAPI still blocked at public Depends(scope=...). V14 was slower; V12 retained. Raw run artifacts were not inspected for this app.","source":"latest"},{"date":"10–11 Nov","track":"Agent","title":"Larger-memory diagnostic","status":"Reported","text":"Timed out without a verified patch. This supplies no evidence that larger memory improved repairs.","source":"latest"},{"date":"10–11 Nov","track":"Agent","title":"HTTPX confirmation case","status":"Reported","text":"Hikmah passed: 603 seconds, 31 calls. Control passed: 583 seconds, 34 calls. Hikmah used three fewer calls and 20 seconds more. One case shows no clear advantage; HTTPX is now exposed and cannot remain untouched holdout.","source":"latest"}],"community":[{"name":"Fixer-Guided Localization (FGL)","type":"Training","status":"Author-reported","idea":"Train the file finder on what helps the fixer understand a correct patch, rather than only which files a reference patch edits.","result":"E4B study: 1,629 verified teacher traces; 27.5% less code for localization; matched dev round 8 vs 6 solved, 53 vs 46 reaching patches; best single-agent run 11/78 vs base 8/78.","limit":"Different comparisons within the paper have different conditions. These are development results and not a leaderboard score or our reproduction.","lesson":"Measure useful context, not merely shorter context. Verified offline teacher data is training data, never live hidden-test help.","source":"fgl"},{"name":"happyc0der experiment diary","type":"Workflow","status":"Author-reported","idea":"Iterate prompts against a faithful sandbox; control loops, first-edit delay, timeouts and environment mismatches.","result":"Log records 0.10 Kaggle scores, a 9/16 local run and proxy holdout runs around 5–7/33. These use different setups and cannot be ranked as one scale.","limit":"Local, proxy and hidden-task scores are not interchangeable. Gold/no-patch tests and import paths matter.","lesson":"A stronger-looking local prompt can tie or lose on hidden tasks.","source":"happy"},{"name":"Public configuration audit","type":"Evaluation","status":"Saved review","idea":"Group repeated runs by identical agent-file hashes.","result":"Selected historical runs: Budget-Fit 8–11 fixes (10 runs); Budget-Aware 7–13 (8); SuperAgent 8–12 (4); baseline 8–11 (3).","limit":"145 selected audit rows, inferred 58-task public denominator. Arithmetic was checked; repairs and causes were not independently reproduced.","lesson":"Keep all repeats and paired outcomes. Do not pick the luckiest run.","source":"audit"},{"name":"Time, Budget, and Thinking","type":"Workflow","status":"Saved review","idea":"Spend reasoning time only where it improves finished repairs.","result":"Author reported two local v19 runs at 44/129 and 49/129; a larger thinking setup at 47/129 with more timeouts.","limit":"Conditions differed; this is not a controlled proof that thinking helps or hurts.","lesson":"Budget tokens, commands and finalization together.","source":"thinking"},{"name":"Instruments kit / graph replay","type":"Retrieval","status":"Saved review","idea":"Fingerprint tools and replay identical requests across software builds.","result":"Authors reported 11 → 270 nonempty answers among 314 graph calls after an update.","limit":"A nonempty graph response is a tool metric. It is not 270 solved bugs or demonstrated repair improvement.","lesson":"Retest tools before inheriting an old prompt that says never use them.","source":"graph"},{"name":"Black Cat Pack Instinct","type":"Retrieval","status":"Saved review","idea":"Keep a scored anchor while exploring identifier, error-message and behavior search.","result":"Inspected v13 separated its anchor from an experimental helper; new leaderboard benefit was unknown.","limit":"Packaging or a clever search routine does not demonstrate a higher repair rate.","lesson":"Retain the strongest validated baseline.","source":"blackcat"},{"name":"TRACE","type":"Evaluation","status":"Saved review","idea":"Record who generated a patch, what tests ran and which failures remained.","result":"Inspected v2 analyzed four selected historical cases; no fresh Gemma execution or reproduced tests in that notebook.","limit":"At least one successful candidate was not attributed to Gemma. Selected passing examples are not an autonomous success rate.","lesson":"Separate model, manual, gold and replayed patch origins.","source":"trace"},{"name":"Loop Breaker / Trap-25","type":"Recovery","status":"Saved review","idea":"Diagnose repeated unproductive actions and change strategy.","result":"Inspected v12 default path displayed 24/25 recovery using a deterministic schedule and supplied correct patches.","limit":"That default validates fixtures, not fresh Gemma repair ability. It does not describe every experiment the author may have run.","lesson":"Require live traces and keep reference answers outside agent input.","source":"loop"},{"name":"Budgeted Hanh Tran baseline","type":"Workflow","status":"Saved review","idea":"Allocate early calls to discovery, middle calls to editing and later calls to testing.","result":"Inspected v8: 28 tool calls and eight minutes per task.","limit":"Notebook title mentioned 0.24 while an indexed panel showed 0.18 for another version. No causal gain established.","lesson":"Use explicit phase budgets as a baseline to test.","source":"baseline"},{"name":"Trajectory SFT + verifier scaffold","type":"Training","status":"Code / plan","idea":"Collect multiple valid repair traces, train a LoRA, then use tests and calibrated selection to choose candidate patches.","result":"Qiwei Li's public repository supplies a strategy and training/verification scaffold.","limit":"No demonstrated competitive score was verified in this review. Best-of-N consumes time and can overfit visible tests.","lesson":"Training comes after environment validation and held-out improvement.","source":"qiwei"},{"name":"GraphNav, AST compression, CRAG and failure taxonomies","type":"Retrieval","status":"Listed only","idea":"Compress repository structure, route memory using graphs, and classify where small agents fail.","result":"These directions appear in the indexed paper-track Code catalog.","limit":"Listing is not evidence of a submitted paper, a working implementation or a measured improvement. Individual claims were not audited here.","lesson":"Use this as a reading queue, not a ranking of successful methods.","source":"catalog"},{"name":"Package shadowing / development validation","type":"Evaluation","status":"Author-reported","idea":"Check which Python package file the evaluator actually imports.","result":"A participant reported Requests tasks passing with empty patches because installed wheels shadowed the repository. Removing the wheel made the fix necessary.","limit":"This is environment-specific. It does not automatically invalidate our repaired run, whose protocol changed import precedence.","lesson":"Require unfixed-fails / gold-passes controls on the exact checkout.","source":"shadow"}],"bottlenecks":[{"name":"Wrong or incomplete code location","simple":"Finding one matching function does not mean finding the whole repair.","evidence":"FastAPI remains unresolved; public Depends() still rejecting scope is reported in later runs.","action":"Follow public helper → parameter object → dependency graph → execution/cleanup. Test imports and signatures before longer tests.","measure":"First relevant read; time to first edit; complete call-chain coverage.","source":"latest"},{"name":"Time and call exhaustion","simple":"An agent can think for so long that it never finishes the fix.","evidence":"Earlier FastAPI timeouts; V14 reportedly slower; larger-memory diagnostic produced no verified repair.","action":"Batch related searches, cap broad output and reserve time for final tests and patch capture.","measure":"Resolved / all scheduled tasks; timeouts; unstarted tasks; total wall time.","source":"v11"},{"name":"Environment can fake success","simple":"Tests may accidentally inspect the installed library instead of your edited files.","evidence":"Dependency and checkout-import repairs in our runtime; public reports of Requests shadowing.","action":"Print module __file__, verify exact commit and run evaluator-only buggy/gold controls.","measure":"Buggy must fail; gold must pass; imports must point into checkout.","source":"shadow"},{"name":"Three familiar tasks are too small","simple":"Repeated practice on the same questions can look like general skill.","evidence":"All earlier arms tied 2/3; the same FastAPI failure was revisited. HTTPX was subsequently tested.","action":"Freeze new repository-disjoint confirmation tasks. Keep exposed HTTPX case separate from new holdout.","measure":"Paired wins/losses across repositories with all failures retained.","source":"pilot"},{"name":"Memory may preserve stale facts","simple":"A notebook of wrong assumptions can make an agent more confident and slower.","evidence":"Larger-memory diagnostic timed out; no measured memory benefit recovered.","action":"Keep a short task-local ledger, cite observed facts, invalidate entries after edits, reset between tasks.","measure":"Recovery after compaction at equal budget; valid final fixes and overhead.","source":"latest"},{"name":"Beautiful metrics can answer the wrong question","simple":"Asking good benchmark questions is different from fixing software.","evidence":"85.48% paper agreement measures finite held-out outputs under a perfect-label oracle. The repository pilot is 2/3.","action":"Keep identity, output agreement, test passing, repair success and leaderboard results separate.","measure":"Display numerator, denominator, task set and evidence origin beside every result.","source":"brief"},{"name":"Quantization and runtime compatibility","simple":"A permitted model can still fail to load with the wrong software.","evidence":"Staff thread records 12B loading problems fixed by a newer wheelhouse. Offline notebooks cannot fetch missing packages.","action":"Pin model revision and wheel hashes; prove offline export/reload before training.","measure":"Cold start, memory use, loader success and repeatability.","source":"models"},{"name":"Unverified attribution and leakage","simple":"A supplied answer can make a demo pass without teaching us whether the model can solve it.","evidence":"TRACE and Loop Breaker inspections distinguish history, fixtures and live generation.","action":"Hide gold patches and grading material; log patch origin, full commands and all failures.","measure":"Auditable run manifests and live traces; clean evaluation boundary.","source":"review"}],"plan":[{"phase":"Paper • immediate","title":"Audit the manuscript and submit the Writeup","why":"The listed paper deadline is 13 November at 04:59 PKT.","steps":["Use the reproduced CPU study as the core evidence.","Check authorship, original/unpublished status, citations and Kaggle's rendered word count.","Add only executed and auditable agent findings; preserve the no-observed-gain result.","Test public resource links and confirm the platform shows Submitted."],"gate":"A saved ZIP or draft is not a submitted entry.","source":"paper"},{"phase":"Agent • repair validity","title":"Audit latest runs before expanding","why":"Later notes are newer than GitHub's V11 README, but raw traces were not read for this app.","steps":["Recover V12/control/V14 and HTTPX manifests, prompts, diffs and evaluator logs.","Verify checkout imports and buggy/gold controls in the exact environment.","Classify FastAPI failure as location, incomplete wiring, API break, tests or budget.","Retain V12 as reported current candidate; do not claim it beats control."],"gate":"Auditable comparison with exact model, runtime, task and budget fingerprints.","source":"latest"},{"phase":"Agent • evidence","title":"Freeze a broader paired experiment","why":"A three-task tuned pilot plus one exposed HTTPX case cannot establish generalization.","steps":["Freeze development and fresh repository-disjoint confirmation sets.","Compare control, generic policy and Hikmah under equal total budgets.","Repeat where affordable; retain paired outcomes, invalid/empty patches, timeouts and unstarted tasks.","Test ledger, retrieval, policy and budget changes separately."],"gate":"Replace baseline only with credible held-out benefit.","source":"v11"},{"phase":"Agent • models / training","title":"Compare E4B only after the baseline works","why":"Model size trades per-call capability against completed iterations.","steps":["Run E4B as a separate same-base submission candidate.","Use actual startup/inference/tools time rather than theoretical token speed.","Only then test tiny LoRA export/reload in the exact offline harness.","Release additional training budget only after held-out improvement."],"gate":"No mixed base models within one archive; no assumed adapter gain.","source":"models"},{"phase":"Agent • release","title":"Rehearse, validate and select final entries","why":"Main entry/merger gate: 26 Nov 04:59 PKT; final: 3 Dec 04:59 PKT.","steps":["Accept rules and confirm entry/team before the gate.","Recheck current HARNESS_README, allowed extensions, archive size and paths.","Rehearse total 12-hour budget, root agent.yaml, offline setup and patch capture.","Preserve the best validated archive and explicitly select eligible finals."],"gate":"Packaging, notebook execution and leaderboard submission are three different steps.","source":"prizes"}],"concepts":[{"id":"c0","name":"Python functions and imports","category":"Foundation","simple":"A function accepts inputs and returns a result; imports decide which implementation your program actually uses.","why":"You must verify that tests import the edited checkout, not an installed wheel.","level":"Foundation"},{"id":"c1","name":"Repository, commit and diff","category":"Foundation","simple":"A repository stores source history. A commit identifies a snapshot. A diff records changed lines.","why":"A repair must apply to exactly the issue's starting commit.","level":"Foundation"},{"id":"c2","name":"API contract","category":"Foundation","simple":"The promise a function makes about arguments, results, errors and side effects.","why":"FastAPI scope must travel through the public and internal interfaces.","level":"Foundation"},{"id":"c3","name":"Unit and regression tests","category":"Foundation","simple":"A unit test checks a focused behavior; a regression test checks that old behavior still works.","why":"Passing one new example does not prove the whole repair is safe.","level":"Foundation"},{"id":"c4","name":"LLM and tokens","category":"Models","simple":"An LLM generates text; tokens are the pieces it reads and produces.","why":"Long answers consume both time and context.","level":"Foundation"},{"id":"c5","name":"Parameters and weights","category":"Models","simple":"Learned numerical settings that shape a model's responses.","why":"31B names a model scale; it is not the amount of useful work completed.","level":"Foundation"},{"id":"c6","name":"Inference versus training","category":"Models","simple":"Inference uses existing weights. Training changes learned weights.","why":"Our saved agent changes its workflow; no new trained adapter is recorded.","level":"Foundation"},{"id":"c7","name":"Agent, tool and harness","category":"Agents","simple":"The agent chooses actions; tools execute them; the harness controls the environment and budget.","why":"A model alone is not a reliable coding agent.","level":"Foundation"},{"id":"c8","name":"Prompt and scaffold","category":"Agents","simple":"Instructions and surrounding software that guide how the model works.","why":"Hikmah begins as evidence-handling behavior around a base model.","level":"Foundation"},{"id":"c9","name":"Patch and validation","category":"Evaluation","simple":"A patch is an edit; validation applies it and runs independent tests.","why":"A nonempty diff is not automatically a successful fix.","level":"Foundation"},{"id":"c10","name":"Baseline and control","category":"Evaluation","simple":"A reference setup used to judge whether a change helps.","why":"Control, generic policy and Hikmah need matched settings.","level":"Foundation"},{"id":"c11","name":"Held-out data","category":"Evaluation","simple":"Examples kept out of development decisions.","why":"The tested HTTPX case is now exposed; use new confirmation tasks.","level":"Foundation"},{"id":"c12","name":"IT checkpoint","category":"Models","simple":"An instruction-tuned model has been trained to respond to requests.","why":"Use the exact permitted checkpoint and template.","level":"Intermediate"},{"id":"c13","name":"Quantization and QAT","category":"Models","simple":"Quantization stores numbers at lower precision; QAT adapts a model while accounting for quantization.","why":"Lower memory does not remove runtime or loader constraints.","level":"Intermediate"},{"id":"c14","name":"W4A16","category":"Models","simple":"A precision label: 4-bit weights and 16-bit activations.","why":"Theoretical weight storage is only part of GPU memory use.","level":"Intermediate"},{"id":"c15","name":"CT checkpoint format","category":"Models","simple":"The allowed names end in ct, denoting the packaged compressed-tensors format in this model family.","why":"A filename or similarly sized GGUF is not automatically an allowed substitute.","level":"Intermediate"},{"id":"c16","name":"Context window and KV cache","category":"Models","simple":"The context window is what the model can attend to; cached attention data also uses GPU memory.","why":"Long traces and large tool outputs can exhaust memory or crowd out useful facts.","level":"Intermediate"},{"id":"c17","name":"Temperature and top-p","category":"Models","simple":"Sampling settings change how varied the generated choices are.","why":"Freeze them across ablations; one successful run can be luck.","level":"Intermediate"},{"id":"c18","name":"Output cap and thinking budget","category":"Models","simple":"Limits on generated tokens and any reasoning allowance.","why":"Extra thinking can steal time from editing and tests.","level":"Intermediate"},{"id":"c19","name":"GPU VRAM and tensor parallelism","category":"Compute","simple":"VRAM is accelerator memory; tensor parallelism divides model work across GPUs.","why":"Four L4 cards provide distributed memory, not one flat 96 GB card.","level":"Intermediate"},{"id":"c20","name":"vLLM and model serving","category":"Compute","simple":"A server receives model requests and returns generated outputs.","why":"Startup and checkpoint compatibility are part of the experiment.","level":"Intermediate"},{"id":"c21","name":"ADK and YAML","category":"Agents","simple":"ADK orchestrates agents; YAML describes their configuration.","why":"The competition compiles agent.yaml under its own restrictions.","level":"Intermediate"},{"id":"c22","name":"Offline wheelhouse","category":"Compute","simple":"A folder of Python packages already downloaded for installation without internet.","why":"Missing dependencies cannot be fetched during L4 scoring.","level":"Intermediate"},{"id":"c23","name":"Sandbox","category":"Agents","simple":"An isolated place where code and shell commands run.","why":"Tools may execute only through permitted competition interfaces.","level":"Intermediate"},{"id":"c24","name":"Lexical search","category":"Retrieval","simple":"Find exact names, words or error messages.","why":"Start with focused rg-style searches before expensive navigation.","level":"Intermediate"},{"id":"c25","name":"Embeddings and semantic retrieval","category":"Retrieval","simple":"Represent code as vectors to find meaning-related snippets.","why":"Similar code can be irrelevant; evaluate final fixes, not search results.","level":"Intermediate"},{"id":"c26","name":"AST and code graph","category":"Retrieval","simple":"An AST represents code structure; a graph links callers, definitions and dependencies.","why":"Follow a changed API through its full call chain.","level":"Intermediate"},{"id":"c27","name":"Localization","category":"Retrieval","simple":"Finding the code needed to understand and fix an issue.","why":"The needed context may be larger than the final changed files.","level":"Intermediate"},{"id":"c28","name":"Evidence ledger and memory","category":"Agents","simple":"A short record of observations, hypotheses, changes and next actions.","why":"Remove stale facts after edits and reset notes between tasks.","level":"Intermediate"},{"id":"c29","name":"Compaction and recovery","category":"Agents","simple":"Summarize old context, then resume using a smaller state.","why":"Check that the agent actually rereads valid notes and still finishes.","level":"Intermediate"},{"id":"c30","name":"Tool-call loop","category":"Agents","simple":"Repeatedly making the same unsuccessful action.","why":"Detect unproductive repeats and change the next action.","level":"Intermediate"},{"id":"c31","name":"Ablation","category":"Evaluation","simple":"Change one component to learn what caused an effect.","why":"Separate policy, budget, sampling, memory and model size.","level":"Intermediate"},{"id":"c32","name":"Paired comparison","category":"Evaluation","simple":"Compare setups on the same tasks under matched conditions.","why":"Count shared solves, unique wins and losses.","level":"Intermediate"},{"id":"c33","name":"Variance and repeated runs","category":"Evaluation","simple":"Results can change even with apparently unchanged settings.","why":"Record all runs; avoid selecting the luckiest score.","level":"Intermediate"},{"id":"c34","name":"Repository-disjoint split","category":"Evaluation","simple":"Keep complete repositories apart between development and confirmation.","why":"This tests transfer beyond familiar projects.","level":"Intermediate"},{"id":"c35","name":"Data leakage","category":"Evaluation","simple":"Information from answers or evaluation enters generation or tuning.","why":"Keep gold patches, targets and hidden grading material outside agent input.","level":"Intermediate"},{"id":"c36","name":"Gold and empty-patch controls","category":"Evaluation","simple":"Gold is a known valid repair; empty means no change.","why":"The buggy repository should fail and gold should pass in the exact sandbox.","level":"Intermediate"},{"id":"c37","name":"Provenance and hashes","category":"Evaluation","simple":"Provenance records origin; hashes identify exact bytes.","why":"Log model, prompt, source, runtime and task fingerprints.","level":"Intermediate"},{"id":"c38","name":"Entropy and information gain","category":"Paper","simple":"Entropy measures uncertainty. A good question separates possible answers.","why":"A perfect split can remove many candidates with one label.","level":"Intermediate"},{"id":"c39","name":"Oracle / supervisor","category":"Paper","simple":"A source assumed to supply the correct answer to a query.","why":"The paper uses perfect labels; a real offline agent has no such guarantee.","level":"Intermediate"},{"id":"c40","name":"Candidate identity versus behavior","category":"Paper","simple":"Two implementations can differ internally yet agree on all tested outputs.","why":"An identity-optimal question is not always behavior-optimal.","level":"Advanced"},{"id":"c41","name":"Probe vocabulary","category":"Paper","simple":"The allowed set of questions an algorithm can ask.","why":"If the right distinction is absent, a better policy cannot recover it.","level":"Intermediate"},{"id":"c42","name":"Macro-averaging","category":"Paper","simple":"Average each family first, then give families equal weight.","why":"A large family should not dominate the reported result.","level":"Advanced"},{"id":"c43","name":"Expected agreement","category":"Paper","simple":"Probability that a uniformly selected surviving candidate matches every finite held-out input.","why":"85.48% is this endpoint, not a real-bug repair score.","level":"Advanced"},{"id":"c44","name":"Decision tree and frugal tree","category":"Paper","simple":"A branching plan of questions; the frugal variant reduces question use under the study's objective.","why":"Measured savings depend on which baseline is used.","level":"Advanced"},{"id":"c45","name":"Post-hoc analysis","category":"Evaluation","simple":"An analysis chosen after observing original results.","why":"Regex compound probes are exploratory, not prospective transfer evidence.","level":"Intermediate"},{"id":"c46","name":"SFT and teacher trajectories","category":"Training","simple":"Supervised fine-tuning teaches from example sequences of reasoning and tool actions.","why":"Train on verified development traces; provenance and leakage controls matter.","level":"Advanced"},{"id":"c47","name":"LoRA / PEFT","category":"Training","simple":"Train small added matrices while keeping most base weights fixed.","why":"An adapter must reload in the organizer's exact quantized runtime.","level":"Advanced"},{"id":"c48","name":"RL and reward hacking","category":"Training","simple":"Reinforcement learning improves behavior against a reward; reward hacking exploits a flawed score.","why":"A test-passing shortcut may fail hidden requirements.","level":"Advanced"},{"id":"c49","name":"Best-of-N and verifier","category":"Training","simple":"Generate multiple candidates and use checks to choose one.","why":"Extra candidates and tests cost time; visible tests can be overfit.","level":"Advanced"},{"id":"c50","name":"Calibration","category":"Evaluation","simple":"Whether confidence matches actual success frequency.","why":"Use it to allocate retries only after measuring reliability.","level":"Advanced"},{"id":"c51","name":"Public versus private leaderboard","category":"Evaluation","simple":"Visible scores use one hidden subset; final rankings use another.","why":"A public development pilot cannot substitute for either.","level":"Intermediate"},{"id":"c52","name":"Wall time and throughput","category":"Compute","simple":"Wall time is elapsed real time; throughput is useful work per unit time.","why":"Measure completed fixes under the whole 12-hour run, including setup.","level":"Intermediate"},{"id":"c53","name":"Reproducibility versus generalization","category":"Evaluation","simple":"Reproducibility repeats a result; generalization works on new cases.","why":"Byte-identical CPU results do not establish real repair ability.","level":"Intermediate"},{"id":"c54","name":"Cognitive core and Hikmah","category":"Agents","simple":"A proposed reusable discipline: verify evidence, track alternatives, admit uncertainty and revise.","why":"Religious/ethical inspiration is a design source; effectiveness still needs empirical tests.","level":"Intermediate"}],"quiz":[{"q":"The paper reports 85.48% agreement. What does that mean?","options":["85.48% of real GitHub bugs were fixed","Expected agreement on every finite held-out input under the benchmark protocol","An official Kaggle leaderboard score"],"answer":1,"explain":"It is a controlled candidate-selection endpoint with perfect labels and a guaranteed correct candidate."},{"q":"Both agents solve two of nks"},{"id":"paper-submit","track":"Paper","text":"Confirm the paper platform displays Submitted"},{"id":"raw","track":"Agent","text":"Audit newest V12/V14/HTTPX raw manifests and traces"},{"id":"imports","track":"Agent","text":"Validate checkout imports and unfixed/gold controls"},{"id":"freeze","track":"Agent","text":"Freeze new development and confirmation schedules"},{"id":"repeat","track":"Agent","text":"Run repeated matched comparisons with all failures retained"},{"id":"entry","track":"Agent","text":"Confirm rules/entry/team before 26 Nov 04:59 PKT"},{"id":"rehearse","track":"Agent","text":"Rehearse complete offline 12-hour inference budget"},{"id":"final","track":"Agent","text":"Validate archive, submit and explicitly select final entries"}]}</script><script id="atlas-app">(function AtlasApp(){

const candidates=[{id:"A",space:"+",safe:true},{id:"B",space:"+",safe:false},{id:"C",space:"%20",safe:true},{id:"D",space:"%20",safe:false}];
function survivors(probes){return candidates.filter(c=>!probes.includes("space")||c.space==="%20").filter(c=>!probes.includes("slash")||c.safe===true)}
function probeView(){const live=survivors(state.probes);return '<div class="row"><span class="eyebrow" style="margin:0">TOY URL-ENCODING EXAMPLE</span>'+pill("Illustration")+'</div><h3 style="margin-top:17px">Four plausible behaviors. Which is intended?</h3><p>Every candidate turns <code>hello</code> into <code>hello</code>. That smoke test tells us nothing. This demo’s trusted supervisor intends spaces as <code>%20</code> and keeps slashes. You know the target here to see how elimination works; a scored selector would not.</p><div class="candidates">'+candidates.map(c=>'<div class="candidate '+(live.some(x=>x.id===c.id)?"":"out")+'"><b>'+c.id+'</b>Space → '+esc(c.space)+'<br>Slash → '+(c.safe?"kept":"%2F")+'</div>').join("")+'</div><div class="probe-buttons"><button class="btn secondary small" data-probe="smoke" '+(state.probes.includes("smoke")?"disabled":"")+'>Ask: hello</button><button class="btn secondary small" data-probe="space" '+(state.probes.includes("space")?"disabled":"")+'>Ask: a b</button><button class="btn secondary small" data-probe="slash" '+(state.probes.includes("slash")?"disabled":"")+'>Ask: a/b</button><button class="btn small" data-action="reset-probes">Reset</button></div><div class="notice green"><b>'+live.length+' candidate'+(live.length===1?"":"s")+' remain'+(live.length===1?": "+live[0].id:"")+'.</b>'+state.probes.length+' questions used. '+(live.length===1?"Distinctive questions found C.":"A useful question separates candidates into different answers.")+'</div><ol class="probe-log">'+state.probes.map(p=>'<li>'+({smoke:"hello → hello; all candidates agree, so none are eliminated.",space:"a b → a%20b; eliminate A and B.",slash:"a/b → a/b; eliminate B and D."}[p])+'</li>').join("")+'</ol>'}

function updateClocks(){document.querySelectorAll("[data-deadline]").forEach(el=>{const d=new Date(el.dataset.deadline)-Date.now();if(d<=0){el.textContent="Listed deadline has passed. Check the platform for submission status.";return}const h=Math.floor(d/3600000),m=Math.floor(d%3600000/60000);el.textContent=(h>=24?Math.floor(h/24)+"d ":"")+(h%24)+"h "+m+"m until listed deadline";})}
function download(name,content,type){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportProgress(){download("Gemma_Atlas_Progress.json",JSON.stringify({format:"gemma-atlas-progress",version:1,exported:new Date().toISOString(),checks:state.checks,learned:state.learned,answers:state.answers,notes:state.notes},null,2),"application/json");toast("Progress backup downloaded.")}
function validateBackup(x){if(!x||x.format!=="gemma-atlas-progress"||x.version!==1||typeof x.notes!=="string"||x.notes.length>200000)throw new Error("Use a Gemma Atlas progress backup.");const pick=(o,ids,type)=>{if(o===null||typeof o!=="object"||Array.isArray(o))throw new Error("Invalid backup fields.");return Object.fromEntries(Object.entries(o).filter(([k,v])=>ids.includes(k)&&typeof v===type))};return {notes:x.notes,checks:pick(x.checks,D.checklist.map(c=>c.id),"boolean"),learned:pick(x.learned,D.concepts.map(c=>c.id),"boolean"),answers:Object.fromEntries(Object.entries(pick(x.answers,D.quiz.map((q,i)=>String(i)),"number")).filter(([k,v])=>Number.isInteger(v)&&v>=0&&v<D.quiz[Number(k)].options.length))}}
document.addEventListener("click",e=>{
const target=e.target.closest("button");if(!target)return;
if(target.dataset.nav){nav(target.dataset.nav);return}
if(target.dataset.resultPage){const title=target.dataset.resultTitle,page=target.dataset.resultPage;state.communityFilter="All";state.timelineFilter="All";state.sourceFilter="All";state.learnCategory="All";state.learnLevel="All";nav(page);const details=[...document.querySelectorAll("details")].find(el=>el.querySelector("summary")?.textContent.includes(title));if(details){details.open=true;details.scrollIntoView({block:"center"})}else{const articles=[...document.querySelectorAll("article")];const article=articles.find(el=>el.querySelector("h3")?.textContent===title);article?.scrollIntoView({block:"center"})}return}
const maps={community:"communityFilter",timeline:"timelineFilter",category:"learnCategory",level:"learnLevel",source:"sourceFilter"};
for(const [d,k]of Object.entries(maps))if(target.dataset[d]!==undefined){state[k]=target.dataset[d];render();return}
if(target.dataset.model!==undefined){state.model=Number(target.dataset.model);render();return}
if(target.dataset.step!==undefined){state.step=Number(target.dataset.step);render();return}
if(target.dataset.probe){state.probes.push(target.dataset.probe);document.getElementById("probe-output").innerHTML=probeView();return}
if(target.dataset.learn){state.learned[target.dataset.learn]=!state.learned[target.dataset.learn];persist();render();return}
if(target.dataset.answer!==undefined){state.answers[state.quiz]=Number(target.dataset.answer);persist();render();return}
const a=target.dataset.action;
if(a==="next-step"){state.step=(state.step+1)%5;render()}
if(a==="reset-probes"){state.probes=[];document.getElementById("probe-output").innerHTML=probeView()}
if(a==="quiz-prev"){state.quiz=Math.max(0,state.quiz-1);render()}
if(a==="quiz-next"){state.quiz=(state.quiz+1)%D.quiz.length;render()}
if(a==="quiz-reset"){state.answers={};state.quiz=0;persist();render()}
if(a==="export")exportProgress();
if(a==="import")document.getElementById("import-file").click();
if(a==="download-app")download("Gemma_Research_Atlas.html","<!doctype html>\n"+document.documentElement.outerHTML,"text/html");
});
document.addEventListener("input",e=>{const el=e.target;if(el.id==="search"){state.search=el.value;render()}if(el.dataset.budget){state.budget[el.dataset.budget]=Number(el.value);document.getElementById("val-"+el.dataset.budget).textContent=el.value+(el.dataset.budget==="tasks"?" tasks":" minutes");document.getElementById("budget-output").innerHTML=budgetView()}if(el.id==="notes"){state.notes=el.value;const ok=persist();document.getElementById("note-status").textContent=ok?"Saved in this browser.":"Storage unavailable. Export a backup."}});
document.addEventListener("change",async e=>{const el=e.target;if(el.id==="depth"){state.depth=el.value;persist();render()}if(el.dataset.check){state.checks[el.dataset.check]=el.checked;persist();render()}if(el.id==="import-file"&&el.files[0]){try{if(el.files[0].size>1500000)throw new Error("Backup is too large.");const clean=validateBackup(JSON.parse(await el.files[0].text()));Object.assign(state,clean);persist();render();toast("Imported personal progress.")}catch(err){toast(err.message||"Could not read the backup.")}el.value=""}});
document.getElementById("menu").addEventListener("click",()=>{const open=document.getElementById("sidebar").classList.toggle("open");document.getElementById("menu").setAttribute("aria-expanded",String(open))});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){document.getElementById("sidebar").classList.remove("open");document.getElementById("menu").setAttribute("aria-expanded","false")}if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName)){e.preventDefault();document.getElementById("search").focus()}});
window.addEventListener("hashchange",()=>{const p=location.hash.slice(1);if(p!==state.page&&pages.some(x=>x[0]===p)){state.page=p;state.search="";document.getElementById("search").value="";render()}});
window.Atlas={state,views,render,budgetStats,survivors,validateBackup,searchItems,D};
render();setInterval(updateClocks,60000);
})();</script><style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}</style></body></html>
