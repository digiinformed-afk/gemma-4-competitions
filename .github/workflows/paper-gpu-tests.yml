name: Paper GPU supervisor checks
on:
  push:
    paths:
      - 'paper-gpu/**'
      - 'Google - The Gemma 4 Developer Agent Paper Track/PatchQuestions_Local/public/project/pilot.py'
      - 'Google - The Gemma 4 Developer Agent Paper Track/PatchQuestions_Local/paper-revision/tests/test_pilot.py'
      - '.github/workflows/paper-gpu-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v -s 'Google - The Gemma 4 Developer Agent Paper Track/PatchQuestions_Local/paper-revision/tests'
      - run: python paper-gpu/verification/gpu-attempt-368723141/audit_gpu.py
